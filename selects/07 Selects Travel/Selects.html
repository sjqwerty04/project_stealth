<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #060608;
    font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  :root {
    --display: 'Instrument Serif', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --accent: #9b8cff;
    --leak-op: 0.85;
  }

  /* ---------- stage ---------- */
  .stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .stage.th-dark { background:
    radial-gradient(120% 80% at 50% -10%, #15131f 0%, #0a0a0f 45%, #060608 100%); }
  .stage.th-light { background:
    radial-gradient(120% 80% at 50% -10%, #e9e7f1 0%, #d9d7e2 60%, #cfcdd8 100%); }
  .stage-leak {
    position: absolute; inset: -20%; pointer-events: none; opacity: calc(var(--leak-op) * 0.5);
    background:
      radial-gradient(40% 30% at 18% 16%, color-mix(in oklab, var(--leak) 55%, transparent) 0%, transparent 60%),
      radial-gradient(36% 26% at 84% 80%, color-mix(in oklab, var(--leak) 40%, transparent) 0%, transparent 60%);
    filter: blur(40px); mix-blend-mode: screen;
  }

  /* ---------- app theme tokens ---------- */
  .app-root {
    --bg: #0a0a0f;
    --surface: rgba(255,255,255,0.055);
    --surface-2: rgba(255,255,255,0.09);
    --hairline: rgba(255,255,255,0.10);
    --text: #f3f2f8;
    --text-dim: rgba(243,242,248,0.64);
    --text-faint: rgba(243,242,248,0.40);
    --grab: rgba(255,255,255,0.22);
    --card: #121219;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }
  .app-root.light {
    --bg: #f4f3f7;
    --surface: rgba(20,18,30,0.045);
    --surface-2: rgba(20,18,30,0.075);
    --hairline: rgba(20,18,30,0.10);
    --text: #17141f;
    --text-dim: rgba(23,20,31,0.62);
    --text-faint: rgba(23,20,31,0.42);
    --grab: rgba(0,0,0,0.18);
    --card: #ffffff;
  }
  .scr-anim { position: absolute; inset: 0; }
  .scr-up { animation: slideUp .45s cubic-bezier(.22,1,.36,1); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(24px); } to { transform: translateY(0); } }

  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; padding: 0; }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px; }

  /* ---------- shared chips ---------- */
  .glass-chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px;
    background: rgba(18,18,26,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); color: #fff;
  }
  .map-expand { padding: 8px; }
  .round-glass {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(18,18,26,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); color: #fff; flex-shrink: 0;
  }
  .app-root.light .round-glass { background: rgba(255,255,255,0.6); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); color: #17141f; }

  /* ================= LOCK ================= */
  .loc-active { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; white-space: nowrap;
    background: rgba(0,0,0,0.28); backdrop-filter: blur(10px); }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #3ad07a; box-shadow: 0 0 0 0 rgba(58,208,122,0.6);

  .leak { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: var(--leak-op); }
  .leak-lock { background:

    box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.18); }
  .notif-dist { margin-left: auto; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap;

  /* ================= DETAIL ================= */

    padding: 58px 14px 12px; transition: background .3s, backdrop-filter .3s; }

    box-shadow: 0 1px 0 var(--hairline); }

  .bar-top-letter, .bar-bot-letter { position: absolute; left: 0; right: 0; height: 22px; background: #000; z-index: 2; }
  .bar-top-letter { top: 0; } .bar-bot-letter { bottom: 0; }
  .np-tag { position: absolute; top: 104px; left: 16px; z-index: 4; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); color: #fff; }
  .np-rec { width: 7px; height: 7px; border-radius: 50%; background: #ff453a; animation: pulse2 1.6s infinite; }
  @keyframes pulse2 { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 5;
    width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: rgba(20,20,28,0.4); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);

  .play-btn:active { transform: translate(-50%,-50%) scale(0.92); }
  .pause-bar { width: 5px; height: 22px; border-radius: 2px; background: #fff; }
  .scrub { position: absolute; left: 16px; right: 16px; bottom: 30px; z-index: 4; display: flex; align-items: center; gap: 10px; }
  .scrub-track { position: relative; flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.25); }
  .scrub-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }

  .detail-body { padding: 18px 18px 0; position: relative; z-index: 2; }
  .scene-title { font-family: var(--display); font-weight: 400; font-size: 42px; line-height: 1.02; letter-spacing: -0.01em; margin: 8px 0 0; }
  .scene-sub { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); margin-top: 9px; letter-spacing: 0.01em; }

  .place-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 13px; border-radius: 18px;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); }
  .place-pin { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex-shrink: 0;

  .place-name { font-weight: 600; font-size: 15.5px; }

  .dist-chip { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 14px; color: var(--accent); flex-shrink: 0; white-space: nowrap; }

  .more-thumb { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }

  .more-name { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }

  /* ================= EXPLORE ================= */
  .leak-explore { background:
    radial-gradient(40% 26% at 82% 12%, color-mix(in oklab, var(--leak) 50%, transparent), transparent 70%),
    radial-gradient(40% 26% at 12% 86%, color-mix(in oklab, var(--leak) 38%, transparent), transparent 70%);
    filter: blur(10px); z-index: 1; }
  .explore-top { position: absolute; top: 56px; left: 16px; right: 16px; z-index: 20; }
  .explore-h { font-family: var(--display); font-size: 34px; font-weight: 400; line-height: 1; margin-top: 3px; color: var(--text); }
  .mode-seg { display: flex; gap: 3px; padding: 3px; border-radius: 13px; background: rgba(18,18,26,0.5);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10); }

  .search-bar { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 13px; padding: 13px 15px; border-radius: 15px;

  .sel-poster { width: 52px; height: 70px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }

  .sel-loc { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
