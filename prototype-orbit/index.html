<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Selects — Orbit Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0B;--card:#18181b;
  --border:#27272a;
  --text:#f4f4f5;--text2:#a1a1aa;--text3:#71717a;--text4:#52525b;
  --blue:#3b82f6;
  --card-w:min(70vw,300px);
  --card-h:min(50vh,370px);
  --gap:8px;
}
html,body{height:100%;overflow:hidden;font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

.shell{height:100dvh;max-width:430px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);overflow:hidden;position:relative;background:var(--bg)}

.orbit-viewport{position:relative;width:100%;height:100%;overflow:hidden}

/* 3x3 grid container */
.orbit-grid{
  display:grid;
  grid-template-columns:repeat(3,var(--card-w));
  grid-template-rows:repeat(3,var(--card-h));
  gap:var(--gap);
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  transition:transform .4s cubic-bezier(.22,1,.36,1);
  z-index:1;
}

/* Individual card */
.grid-card{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  background:#111;
  border:1px solid rgba(255,255,255,.06);
  cursor:pointer;
  transition:box-shadow .3s ease,border-color .3s ease;
}
.grid-card.center{
  border-color:rgba(255,255,255,.15);
  box-shadow:0 0 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1);
}

/* Card backgrounds */
.card-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.card-trailer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
.card-trailer.active{opacity:.45}
.card-trailer iframe{position:absolute;top:50%;left:50%;width:200%;height:200%;transform:translate(-50%,-50%);border:none}
.card-still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.card-still.active{opacity:.35}

/* Gradient */
.card-gradient{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(9,9,11,.85) 5%,rgba(9,9,11,.4) 40%,transparent 65%,rgba(9,9,11,.3) 100%);pointer-events:none}

/* Card content */
.card-content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 10px;text-align:center;pointer-events:none}
.card-logo{max-width:75%;max-height:40px;object-fit:contain;filter:drop-shadow(0 3px 16px rgba(0,0,0,.8));opacity:0;transition:opacity .5s ease;margin-bottom:6px}
.card-logo.active{opacity:1}
.card-title{font-size:13px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.9);opacity:0;transition:opacity .5s ease;line-height:1.2;margin-bottom:4px}
.card-title.active{opacity:1}

/* Center card gets bigger logo and extra info */
.grid-card.center .card-logo{max-height:64px;max-width:80%}
.grid-card.center .card-title{font-size:22px}
.card-meta{font-size:9px;color:var(--text2);text-shadow:0 1px 6px rgba(0,0,0,.6);margin-top:2px;opacity:0;transition:opacity .4s ease}
.card-meta.active{opacity:1}
.card-genres{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:3px}
.card-genres span{font-size:8px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:var(--text2)}
.card-reason{font-size:10px;color:var(--text3);font-style:italic;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.5);line-height:1.3;max-width:90%}

/* Axis labels on center card */
.axis-label{
  position:absolute;z-index:3;
  font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
  color:rgba(255,255,255,.3);pointer-events:none;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
}
.axis-label.ax-top{top:8px;left:50%;transform:translateX(-50%)}
.axis-label.ax-bottom{bottom:8px;left:50%;transform:translateX(-50%)}
.axis-label.ax-left{left:8px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:center}
.axis-label.ax-right{right:8px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:center}

/* Empty card placeholder */
.card-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:10px;font-weight:600}

/* Floating controls */
.controls{position:absolute;bottom:14px;right:14px;z-index:10;display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;opacity:.4}
.icon-btn:hover{opacity:1;color:var(--text)}

.coords{position:absolute;top:10px;left:12px;z-index:10;font-size:9px;color:var(--text4);font-weight:600;letter-spacing:1px;opacity:.35}

/* Loading overlay */
.loading-overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(9,9,11,.92);opacity:0;pointer-events:none;transition:opacity .25s ease}
.loading-overlay.active{opacity:1;pointer-events:auto}
.loading-overlay p{font-size:12px;color:var(--text3);font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin .8s linear infinite}

/* Swipe hint */
.swipe-hint{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(9,9,11,.65);backdrop-filter:blur(4px);opacity:1;transition:opacity .5s ease;pointer-events:none}
.swipe-hint.hidden{opacity:0}
.swipe-hint-inner{text-align:center;color:var(--text3)}
.swipe-hint-inner p{font-size:13px;font-weight:500;margin-top:8px}
.swipe-hint-inner .arrows{font-size:22px;letter-spacing:10px;color:var(--text4)}
</style>
</head>
<body>

<div class="shell">
  <div class="orbit-viewport" id="viewport">
    <div class="orbit-grid" id="orbitGrid"></div>

    <div class="controls">
      <button id="toggleBtn" class="icon-btn" onclick="toggleMode()" title="Switch to stills">
        <span id="toggleIcon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg></span>
      </button>
      <button id="muteBtn" class="icon-btn" onclick="toggleMute()" title="Unmute">
        <span id="muteBtnIcon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></span>
      </button>
    </div>

    <div class="coords" id="coords">(0, 0)</div>

    <div class="loading-overlay" id="loadingOverlay">
      <svg class="spinner" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <p id="loadingText">Loading orbit...</p>
    </div>

    <div class="swipe-hint" id="swipeHint">
      <div class="swipe-hint-inner">
        <div class="arrows">&#8593; &#8595; &#8592; &#8594;</div>
        <p>Swipe or use arrow keys to explore</p>
      </div>
    </div>
  </div>
</div>

<script>
const TMDB_KEY='087e509f6f93e629488a550f1451bb76';
const TMDB='https://api.themoviedb.org/3';
const IMG=(path,size='w500')=>path?`https://image.tmdb.org/t/p/${size}${path}`:null;

const DIRS={
  up:   {dx:0,dy:-1,label:'Visual',      loadMsg:'Finding visually similar films...'},
  down: {dx:0,dy:1, label:'Storytelling', loadMsg:'Finding similar storytelling...'},
  left: {dx:-1,dy:0,label:'Emotional',    loadMsg:'Finding emotionally similar films...'},
  right:{dx:1,dy:0, label:'Balanced',     loadMsg:'Finding balanced matches...'},
};

// 3x3 grid offsets: row-major (top-left to bottom-right)
const GRID_OFFSETS=[
  {dx:-1,dy:-1},{dx:0,dy:-1},{dx:1,dy:-1},
  {dx:-1,dy:0}, {dx:0,dy:0}, {dx:1,dy:0},
  {dx:-1,dy:1}, {dx:0,dy:1}, {dx:1,dy:1},
];

const grid=new Map();
let currentPos={x:0,y:0};
let isNavigating=false;
let isMuted=true;
let showTrailer=true;
let audioCtx=null;
let hintShown=false;
const usedIds=new Set();

function gk(x,y){return`${x},${y}`}

const mutedSVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
const unmutedSVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
const trailerIconSVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>';
const stillIconSVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

// ─── TMDB Fetch ──────────────────────────────────────────────
async function fetchMovieDetails(tmdbId){
  try{
    const r=await fetch(`${TMDB}/movie/${tmdbId}?api_key=${TMDB_KEY}&append_to_response=credits`);
    const d=await r.json();
    const director=d.credits?.crew?.find(c=>c.job==='Director')?.name||'';
    const genres=(d.genres||[]).slice(0,3).map(g=>g.name);
    const rt=d.runtime||0;
    const hrs=Math.floor(rt/60),mins=rt%60;
    return{
      id:d.id,title:d.title,year:(d.release_date||'').slice(0,4),
      runtime:rt>0?(hrs>0?`${hrs}h ${mins}m`:`${mins}m`):'',
      poster:IMG(d.poster_path,'w200'),
      backdrop:IMG(d.backdrop_path,'w780'),
      director,genres,
    };
  }catch(e){return null}
}

async function fetchMovieImages(tmdbId){
  try{
    const[imgRes,vidRes]=await Promise.all([
      fetch(`${TMDB}/movie/${tmdbId}/images?api_key=${TMDB_KEY}&include_image_language=en,null`),
      fetch(`${TMDB}/movie/${tmdbId}/videos?api_key=${TMDB_KEY}&language=en-US`),
    ]);
    const img=await imgRes.json();
    const vid=await vidRes.json();
    const logo=(img.logos||[]).find(l=>l.iso_639_1==='en')||(img.logos||[])[0];
    const bd=(img.backdrops||[])[0];
    const trailer=(vid.results||[]).find(v=>v.site==='YouTube'&&(v.type==='Trailer'||v.type==='Teaser')&&v.official)||
                  (vid.results||[]).find(v=>v.site==='YouTube'&&(v.type==='Trailer'||v.type==='Teaser'));
    return{
      logoUrl:logo?.file_path?IMG(logo.file_path,'w500'):null,
      heroStill:bd?.file_path?IMG(bd.file_path,'w780'):null,
      trailerKey:trailer?.key||null,
    };
  }catch(e){return{logoUrl:null,heroStill:null,trailerKey:null}}
}

async function fetchSimilar(tmdbId){
  try{
    const[simRes,recRes]=await Promise.all([
      fetch(`${TMDB}/movie/${tmdbId}/similar?api_key=${TMDB_KEY}&language=en-US&page=1`),
      fetch(`${TMDB}/movie/${tmdbId}/recommendations?api_key=${TMDB_KEY}&language=en-US&page=1`),
    ]);
    const sim=await simRes.json();
    const rec=await recRes.json();
    const all=[...(rec.results||[]),...(sim.results||[])];
    const seen=new Set();
    const unique=[];
    for(const m of all){if(!seen.has(m.id)&&m.poster_path){seen.add(m.id);unique.push(m)}}
    return unique;
  }catch(e){return[]}
}

async function loadMovieForGrid(tmdbId,reason){
  const details=await fetchMovieDetails(tmdbId);
  if(!details)return null;
  const images=await fetchMovieImages(tmdbId);
  return{
    ...details,logoUrl:images.logoUrl,
    heroStill:images.heroStill||details.backdrop,
    trailerKey:images.trailerKey,
    reason:reason||'',loaded:true,
  };
}

async function findNeighborMovie(fromTmdbId,dx,dy){
  const similar=await fetchSimilar(fromTmdbId);
  const pool=similar.filter(m=>!usedIds.has(m.id));
  if(!pool.length)return null;
  const idx=Math.abs(dx*3+dy*7)%Math.max(1,pool.length);
  const pick=pool[Math.min(idx,pool.length-1)];
  let label='';
  if(dx===0&&dy===-1)label='Visual';
  else if(dx===0&&dy===1)label='Storytelling';
  else if(dx===-1&&dy===0)label='Emotional';
  else if(dx===1&&dy===0)label='Balanced';
  else label='Connection';
  const movie=await loadMovieForGrid(pick.id,`${label} link`);
  if(movie)usedIds.add(movie.id);
  return movie;
}

// ─── Seed grid with Batman + 8 neighbors ─────────────────────
const SEEDS=[
  {dx:0,dy:0,  tmdbId:414906,reason:''},
  {dx:0,dy:-1, tmdbId:335984,reason:'Neon-soaked noir like The Batman'},
  {dx:1,dy:0,  tmdbId:155,   reason:'Dark hero mythology from The Batman'},
  {dx:0,dy:1,  tmdbId:807,   reason:'Gritty detective thriller like The Batman'},
  {dx:-1,dy:0, tmdbId:475557,reason:'Same brooding isolation as The Batman'},
  {dx:-1,dy:-1,tmdbId:64690, reason:'Visual mood + emotional intensity'},
  {dx:1,dy:-1, tmdbId:27205, reason:'Visual spectacle + balanced craft'},
  {dx:-1,dy:1, tmdbId:146233,reason:'Narrative tension + emotional weight'},
  {dx:1,dy:1,  tmdbId:1949,  reason:'Storytelling depth + balanced mystery'},
];

async function seedGrid(){
  await Promise.all(SEEDS.map(async s=>{
    const movie=await loadMovieForGrid(s.tmdbId,s.reason);
    if(movie){grid.set(gk(s.dx,s.dy),movie);usedIds.add(movie.id)}
  }));
}

// ─── Render a single card ────────────────────────────────────
function buildCardHTML(movie,isCenter){
  if(!movie)return'<div class="card-empty">...</div>';

  let bgHTML='';
  if(showTrailer&&movie.trailerKey){
    bgHTML=`<div class="card-trailer"><iframe src="https://www.youtube.com/embed/${movie.trailerKey}?autoplay=1&mute=${isMuted?1:0}&loop=1&playlist=${movie.trailerKey}&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${location.origin}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>`;
  }
  const stillHTML=movie.heroStill?`<img class="card-still" src="${movie.heroStill}" alt="">`:'';

  const logoOrTitle=movie.logoUrl
    ?`<img class="card-logo" src="${movie.logoUrl}" alt="${movie.title}">`
    :`<div class="card-title">${movie.title}</div>`;

  let extraHTML='';
  if(isCenter){
    let meta=[];
    if(movie.year)meta.push(movie.year);
    if(movie.runtime)meta.push(movie.runtime);
    if(movie.director)meta.push(movie.director);
    const genresHTML=(movie.genres||[]).map(g=>`<span>${g}</span>`).join('');
    extraHTML=`
      <div class="card-meta">${meta.join(' &bull; ')}</div>
      ${genresHTML?`<div class="card-genres">${genresHTML}</div>`:''}
      ${movie.reason?`<div class="card-reason">&ldquo;${movie.reason}&rdquo;</div>`:''}
    `;
  }

  return`
    <div class="card-bg">${bgHTML}${stillHTML}</div>
    <div class="card-gradient"></div>
    <div class="card-content">
      ${logoOrTitle}
      ${extraHTML}
    </div>
  `;
}

// ─── Render the full 3x3 grid ────────────────────────────────
function renderGrid(){
  const container=document.getElementById('orbitGrid');
  container.innerHTML='';
  container.style.transition='none';
  container.style.transform='translate(-50%,-50%)';

  GRID_OFFSETS.forEach((off,i)=>{
    const wx=currentPos.x+off.dx;
    const wy=currentPos.y+off.dy;
    const movie=grid.get(gk(wx,wy));
    const isCenter=(off.dx===0&&off.dy===0);

    const card=document.createElement('div');
    card.className='grid-card'+(isCenter?' center':'');
    card.dataset.gx=wx;
    card.dataset.gy=wy;
    card.innerHTML=buildCardHTML(movie,isCenter);

    if(isCenter){
      card.innerHTML+=`
        <span class="axis-label ax-top">Visual</span>
        <span class="axis-label ax-bottom">Storytelling</span>
        <span class="axis-label ax-left">Emotional</span>
        <span class="axis-label ax-right">Balanced</span>
      `;
    }

    container.appendChild(card);

    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const trailer=card.querySelector('.card-trailer');
      const still=card.querySelector('.card-still');
      const logo=card.querySelector('.card-logo');
      const title=card.querySelector('.card-title');
      const meta=card.querySelector('.card-meta');
      if(showTrailer&&trailer)trailer.classList.add('active');
      if((!showTrailer||!trailer)&&still)still.classList.add('active');
      if(logo)logo.classList.add('active');
      if(title)title.classList.add('active');
      if(meta)meta.classList.add('active');
    }));
  });

  document.getElementById('coords').textContent=`(${currentPos.x}, ${currentPos.y})`;
}

// ─── Navigation ──────────────────────────────────────────────
async function navigate(direction){
  if(isNavigating)return;
  isNavigating=true;

  if(!hintShown){
    document.getElementById('swipeHint').classList.add('hidden');
    hintShown=true;
  }

  const dirMap={up:{dx:0,dy:-1},down:{dx:0,dy:1},left:{dx:-1,dy:0},right:{dx:1,dy:0}};
  const d=dirMap[direction];
  const nx=currentPos.x+d.dx;
  const ny=currentPos.y+d.dy;

  // Check if center destination exists
  if(!grid.has(gk(nx,ny))){
    const fromMovie=grid.get(gk(currentPos.x,currentPos.y));
    if(fromMovie){
      const loading=document.getElementById('loadingOverlay');
      document.getElementById('loadingText').textContent=DIRS[direction]?.loadMsg||'Loading...';
      loading.classList.add('active');

      const movie=await findNeighborMovie(fromMovie.id,d.dx,d.dy);
      if(movie)grid.set(gk(nx,ny),movie);
      loading.classList.remove('active');
      if(!movie){isNavigating=false;return}
    }else{isNavigating=false;return}
  }

  if(navigator.vibrate)navigator.vibrate(8);
  playReelClick();

  // Animate grid shift
  const container=document.getElementById('orbitGrid');
  const shiftX=-(d.dx)*(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w'))||300);
  const shiftY=-(d.dy)*(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-h'))||370);

  // Compute actual card dimensions from the rendered grid
  const firstCard=container.querySelector('.grid-card');
  const cardW=firstCard?firstCard.offsetWidth:300;
  const cardH=firstCard?firstCard.offsetHeight:370;
  const gap=8;

  const tx=-(d.dx)*(cardW+gap);
  const ty=-(d.dy)*(cardH+gap);

  container.style.transition='transform .4s cubic-bezier(.22,1,.36,1)';
  container.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;

  setTimeout(async()=>{
    currentPos={x:nx,y:ny};

    // Pre-fetch any missing neighbors for new position
    const missingPromises=[];
    GRID_OFFSETS.forEach(off=>{
      const wx=nx+off.dx,wy=ny+off.dy;
      if(!grid.has(gk(wx,wy))){
        const centerMovie=grid.get(gk(nx,ny));
        if(centerMovie){
          missingPromises.push(
            findNeighborMovie(centerMovie.id,off.dx,off.dy).then(m=>{
              if(m)grid.set(gk(wx,wy),m);
            })
          );
        }
      }
    });

    if(missingPromises.length){
      await Promise.all(missingPromises);
    }

    renderGrid();
    isNavigating=false;
  },420);
}

// ─── Swipe Detection ─────────────────────────────────────────
let touchStart=null;
const SWIPE_THRESHOLD=50;

document.addEventListener('touchstart',e=>{
  if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});

document.addEventListener('touchend',e=>{
  if(!touchStart)return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  touchStart=null;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(Math.max(adx,ady)<SWIPE_THRESHOLD)return;
  if(adx>ady){navigate(dx<0?'right':'left')}
  else{navigate(dy<0?'down':'up')}
},{passive:true});

document.addEventListener('keydown',e=>{
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(map[e.key]){e.preventDefault();navigate(map[e.key])}
});

// ─── Mute / Unmute ───────────────────────────────────────────
function toggleMute(){
  isMuted=!isMuted;
  document.getElementById('muteBtn').title=isMuted?'Unmute':'Mute';
  document.getElementById('muteBtnIcon').innerHTML=isMuted?mutedSVG:unmutedSVG;
  const cmd=JSON.stringify({event:'command',func:isMuted?'mute':'unMute',args:[]});
  document.querySelectorAll('.card-trailer iframe').forEach(iframe=>{
    try{iframe.contentWindow.postMessage(cmd,'*')}catch(e){}
  });
}

// ─── Trailer / Still Toggle ──────────────────────────────────
function toggleMode(){
  showTrailer=!showTrailer;
  document.getElementById('toggleBtn').title=showTrailer?'Switch to stills':'Switch to trailers';
  document.getElementById('toggleIcon').innerHTML=showTrailer?trailerIconSVG:stillIconSVG;
  renderGrid();
}

// ─── Film Reel Click Sound ───────────────────────────────────
function playReelClick(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.type='square';
    osc.frequency.setValueAtTime(800,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200,audioCtx.currentTime+.03);
    gain.gain.setValueAtTime(.08,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.04);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime+.04);
  }catch(e){}
}

// ─── Boot ────────────────────────────────────────────────────
(async function boot(){
  const loading=document.getElementById('loadingOverlay');
  document.getElementById('loadingText').textContent='Loading orbit...';
  loading.classList.add('active');

  await seedGrid();
  renderGrid();

  loading.classList.remove('active');

  setTimeout(()=>{
    document.getElementById('swipeHint').classList.add('hidden');
    hintShown=true;
  },3500);
})();
</script>
