<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selects">
  <title>Selects</title>
  <!-- Clapstick. Five takes, one selected.
       Bar width 14, pitch 24, shear 24 over 100 (13.5deg), first bar at x=7.
