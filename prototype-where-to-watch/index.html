<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where to watch · three options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #0A0A0B;
    --base-3: #1D1D20;
    --card: #18181b;
    --line: #2B2B2F;
    --fg: #EFEDE9;
    --fg-2: #B9B6B0;
    --fg-3: #7C7A76;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070708; color: var(--fg); font-family: Archivo, ui-sans-serif, system-ui, sans-serif; }
  body { padding: 28px 24px 48px; }
  header { max-width: 1180px; margin: 0 auto 22px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
  header p { margin: 6px 0 0; color: var(--fg-3); font-family: "Martian Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .stage { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 10px; }
  figcaption strong { display: block; font-size: 14px; letter-spacing: -0.02em; }
  figcaption span { display: block; margin-top: 3px; color: var(--fg-3); font-size: 12px; line-height: 1.4; }
  .phone {
    height: 760px;
    background: var(--base);
    border: 1px solid var(--line);
    border-radius: 28px;
    overflow: hidden;
    position: relative;
  }
  .scroll { height: 100%; overflow: auto; }
  .scroll::-webkit-scrollbar { display: none; }
  .hero {
    height: 210px;
    background:
      linear-gradient(to top, #0A0A0B 0%, rgba(10,10,11,0.15) 46%, rgba(10,10,11,0.35) 100%),
      url("https://image.tmdb.org/t/p/w780/suaEOtk1N1sgg2MTM7oZd2cfVp3.jpg") center 30% / cover no-repeat;
    position: relative;
  }
  .hero h2 {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 14px;
    margin: 0;
    text-align: center;
    font-size: 28px;
    letter-spacing: -0.03em;
    text-shadow: 0 8px 24px #000;
  }
  .meta { padding: 12px 16px 0; text-align: center; color: var(--fg-3); font-size: 13px; }
  .ratings { display: flex; justify-content: center; gap: 18px; padding: 14px 16px 4px; }
  .ratings b { font-size: 18px; font-weight: 800; }
  .ratings span { color: var(--fg-3); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 4px; font-family: "Martian Mono", ui-monospace, monospace; }
  .pad { padding: 12px 14px 28px; }
  .spec { font-family: "Martian Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
  .card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 14px; }
  .group { margin-top: 12px; }
  .group:first-child { margin-top: 10px; }
  .rail { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .mark, .tile {
    width: 40px; height: 40px; flex: 0 0 40px;
  }
  .mark { background: var(--base); display: flex; align-items: center; justify-content: center; }
  .mark img { width: 22px; height: 22px; object-fit: contain; }
  .tile { object-fit: cover; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 44px; color: inherit; text-decoration: none; }
  .row .name { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .see {
    margin-top: 8px;
    min-height: 44px;
    background: none;
    border: 0;
    color: var(--fg-2);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 0;
    cursor: pointer;
  }
  .credit { margin: 12px 0 0; color: var(--fg-3); font-size: 11px; }
  .credit a { color: var(--fg-2); }
  .actions { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 8px; margin-top: 12px; }
  .actions button, .split button {
    min-height: 44px;
    border: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .actions .primary { background: var(--fg); color: #111; }
  .actions .ghost, .split .ghost { background: var(--base-3); color: var(--fg); border: 1px solid var(--line); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .trigger {
    margin-top: 12px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    color: var(--fg);
    font: inherit;
    cursor: pointer;
    text-align: left;
  }
  .stack { display: flex; }
  .stack .mark, .stack .tile { margin-left: -8px; border: 2px solid var(--card); }
  .stack .mark:first-child, .stack .tile:first-child { margin-left: 0; }
  .trigger .copy { display: flex; flex-direction: column; gap: 2px; }
  .trigger .copy b { font-size: 14px; font-weight: 600; }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-height: 78%;
    background: #121214;
    border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    padding: 10px 14px 16px;
    overflow: auto;
    transform: translateY(110%);
    transition: transform 180ms ease;
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 36px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
  .sheet h3 { margin: 0; font-size: 16px; }
  @media (max-width: 980px) {
    .stage { grid-template-columns: 1fr; max-width: 420px; }
  }
</style>
</head>
<body>
<header>
  <h1>Where to watch</h1>
  <p>Pulp Fiction · United States · stream, rent, buy · no prices</p>
</header>
<div class="stage">
  <figure>
    <figcaption>
      <strong>A. Rails</strong>
      <span>Icons only. Extra offers scroll sideways. Shortest, and the marks have to carry the name.</span>
    </figcaption>
    <div class="phone"><div class="scroll" id="phone-a"></div></div>
  </figure>
  <figure>
    <figcaption>
      <strong>B. Named rows</strong>
      <span>White mark, service name, and Stream, Rent, or Buy. The first three in each group show. See all opens the rest.</span>
    </figcaption>
    <div class="phone"><div class="scroll" id="phone-b"></div></div>
  </figure>
  <figure>
    <figcaption>
      <strong>C. Sheet</strong>
      <span>One line on the page. The full named list opens from the bottom and leaves the film page short.</span>
    </figcaption>
    <div class="phone" id="phone-c"></div>
  </figure>
</div>
<script>
const OFFERS = {
  stream: [
    'Amazon Prime Video',
    'fuboTV',
    'Paramount Plus Premium',
    'Paramount Plus Essential',
    'Paramount+ Amazon Channel',
    'YouTube TV',
    'Paramount+ Roku Premium Channel',
    'Amazon Prime Video with Ads',
  ],
  rent: ['Amazon Video', 'Spectrum On Demand', 'Apple TV Store', 'Fandango At Home'],
  buy: ['Amazon Video', 'Apple TV Store', 'Fandango At Home'],
};
const MARK = {
  'Amazon Prime Video': 'primevideo',
  'Amazon Prime Video with Ads': 'primevideo',
  'fuboTV': 'fubo',
  'Paramount Plus Premium': 'paramountplus',
  'Paramount Plus Essential': 'paramountplus',
  'Paramount+ Amazon Channel': 'paramountplus',
  'YouTube TV': 'youtubetv',
  'Paramount+ Roku Premium Channel': 'paramountplus',
  'Amazon Video': 'amazon',
  'Apple TV Store': 'appletv',
  'Fandango At Home': 'fandango',
};
const TILE = {
  'Spectrum On Demand': 'https://image.tmdb.org/t/p/w92/xiUQmGI2bi8Rn6C5u2bArB4YHMp.jpg',
};
const LINK = 'https://www.justwatch.com/us/movie/pulp-fiction';
const COUNT = Object.values(OFFERS).reduce((n, list) => n + list.length, 0);

function mark(name) {
  if (MARK[name]) return `<span class="mark"><img src="../public/providers/${MARK[name]}.svg" alt=""></span>`;
  return `<img class="tile" src="${TILE[name]}" alt="">`;
}

function chrome() {
  return `
    <div class="hero"><h2>Pulp Fiction</h2></div>
    <p class="meta">1994 · 2h 34m · Quentin Tarantino · R</p>
  `;
}

function actions() {
  return `
    <div class="actions">
      <button class="primary" type="button">Add to Calendar</button>
      <button class="ghost" type="button">Save</button>
    </div>
    <div class="split">
      <button class="primary" type="button">Enter Orbit</button>
      <button class="ghost" type="button">Ask AI</button>
    </div>
  `;
}

function credit() {
  return `<p class="credit">Powered by <a href="${LINK}">JustWatch</a></p>`;
}

function rails(kind) {
  return `<div class="group"><div class="spec">${kind}</div><div class="rail">${OFFERS[kind].map(mark).join('')}</div></div>`;
}

document.getElementById('phone-a').innerHTML = `
  ${chrome()}
  <div class="pad">
    <div class="card">
      <div class="spec">Where to watch</div>
      ${rails('stream')}
      ${rails('rent')}
      ${rails('buy')}
      ${credit()}
    </div>
    ${actions()}
  </div>
`;

function rows(kind, list) {
  return `
    <div class="group">
      <div class="spec">${kind}</div>
      ${list.map((name) => `<a class="row" href="${LINK}"><span class="mark-slot">${mark(name)}</span><span class="name">${name}</span><span class="spec">${kind}</span></a>`).join('')}
    </div>
  `;
}

const phoneB = document.getElementById('phone-b');
let openB = false;
function renderB() {
  const stream = openB ? OFFERS.stream : OFFERS.stream.slice(0, 3);
  const rent = openB ? OFFERS.rent : OFFERS.rent.slice(0, 3);
  phoneB.innerHTML = `
    ${chrome()}
    <div class="pad">
      <div class="card">
        <div class="spec">Where to watch</div>
        ${rows('Stream', stream)}
        ${rows('Rent', rent)}
        ${rows('Buy', OFFERS.buy)}
        <button class="see" type="button" id="see-all">${openB ? 'Show less' : 'See all'}</button>
        ${credit()}
      </div>
      ${actions()}
    </div>
  `;
  document.getElementById('see-all').onclick = () => {
    openB = !openB;
    renderB();
  };
}
renderB();

const phoneC = document.getElementById('phone-c');
phoneC.innerHTML = `
  <div class="scroll">
    ${chrome()}
    <div class="pad">
      ${actions()}
      <button class="trigger" type="button" id="open-sheet">
        <span class="stack">${OFFERS.stream.slice(0, 4).map(mark).join('')}</span>
        <span class="copy"><b>Where to watch</b><span class="spec">${COUNT} services</span></span>
      </button>
    </div>
  </div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h3>Where to watch</h3>
    ${rows('Stream', OFFERS.stream)}
    ${rows('Rent', OFFERS.rent)}
    ${rows('Buy', OFFERS.buy)}
    ${credit()}
  </div>
`;
document.getElementById('open-sheet').onclick = () => {
  document.getElementById('sheet').classList.toggle('open');
};
</script>
</body>
</html>
